id: layer-filter-plugin
name: Layer Filter
version: 1.0.0
extensions:
  - id: layer-filter-widget
    type: widget
    name: Layer Filter
    schema:
      groups:
        - id: layer_settings
          title: Layer Settings
          fields:
            - id: layer_name
              type: string
              title: Layer Name (optional)
        - id: filters
          title: Filter Properties
          list: true
          fields:
            - id: property_name
              type: string
              title: Property Name
            - id: filter_type
              type: string
              title: Filter Type
              ui: selection
              choices:
                - key: dropdown
                  label: Dropdown
                - key: range
                  label: Range Slider
                - key: text
                  label: Text Search
